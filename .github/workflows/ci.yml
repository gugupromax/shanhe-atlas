name: Atlas Integrity CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Atlas Integrity & Regression Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify generated event pinyin and search regressions
        run: |
          npm ci --prefix scripts/search-pinyin --ignore-scripts --no-audit --no-fund
          npm test --prefix scripts/search-pinyin

      - name: Run shared non-browser regression checks
        id: regression
        run: node scripts/verify_all.cjs

      - name: Upload regression failure logs
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-logs
          path: .runtime/verify-*.log
          include-hidden-files: true

      - name: Verify the 2D and 3D terrain extension
        run: |
          node --check terrain-app.js
          node --check integration.js
          node --check map-surface.js
          node --check fusion-protocol.js
          node --check map-surface-material.js
          node scripts/build_tang_741_tiles.cjs --check --allow-unbuilt
          node scripts/build_tang_741.cjs --check
          node scripts/build_longmarch.cjs --check
          node scripts/verify_longmarch.cjs
          python3 -B scripts/tests/test_period_admin_identity.py
          python3 scripts/verify_data.py
          python3 scripts/verify_launcher.py --offline

      - name: Verify polygon bundles are canonical encodings
        run: node scripts/build_atlas.js --check

      - name: Check polity border topology against baseline
        run: node scripts/audit_topology.js --check

      - name: Check prefecture layer against baseline
        run: node scripts/audit_prefectures.js --check

      - name: Check data references against baseline
        run: node scripts/audit_sources.js --check

      - name: Test the click-stats Worker
        run: node workers/stats/test.js

      - name: Check responsive UI layout geometry and non-overlap
        run: node scripts/audit_layout.js --check
