<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多战场联动样板 · 山河图集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6ddc8;color:#243b35;font:14px/1.5 "Microsoft YaHei",sans-serif}.layout{min-height:100vh;display:grid;grid-template-rows:auto minmax(360px,1fr) auto;max-width:1560px;margin:auto;padding:16px 22px;gap:10px}
header{display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font:700 clamp(22px,4vw,38px)/1.2 SimSun,serif;margin:0}header p{margin:3px 0 0}.views,.play{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #8b917f;border-radius:3px;background:#f3eddb;color:#263d36;padding:5px 9px}button:focus-visible{outline:2px solid #925438}button:hover{background:#dcdac3}button[aria-pressed=true]{background:#36564a;color:white}button:disabled{cursor:default;opacity:.55}
.board{min-height:360px;display:grid;grid-template-columns:minmax(0,1fr) 295px;border:1px solid #9b9784;background:#f8f2e3}
#map{width:100%;height:100%;min-height:360px;background:#b5bb95}.land{fill:#c1ba91}.river{fill:none;stroke:#739d95;stroke-width:2.4}.route{stroke:#8e7547;stroke-width:.44;stroke-dasharray:1.5 1.2}.front-dot{fill:#f6e5b3;stroke:#423e31;stroke-width:.6}.friendly{fill:#a44235}.opposing{fill:#2f5e65}.flag{stroke:#eee8d4;stroke-width:.31}.map-label{fill:#213c32;paint-order:stroke;stroke:#f5ebd3;stroke-width:.38;font-size:2.15px;font-weight:bold}.compact .map-label{font-size:1.1px;stroke-width:.24}.compact .flag{stroke-width:.24}
aside{min-width:0;padding:12px;border-left:1px solid #b4ac94;display:grid;grid-template-rows:auto auto auto 1fr;gap:5px;max-height:70vh;overflow:auto}aside h2{font:700 19px SimSun,serif;margin:3px 0}#front-status,#units,#journal{margin:0;padding:0;list-style:none}#front-status li,#units li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid #d7ceb7}#units button{padding:2px 5px;text-align:left}.role{color:#4d5d50;font-size:12px}#journal li{padding:5px 0;border-bottom:1px solid #d7ceb7}#journal li small{display:block;color:#4d5d50}footer{display:flex;align-items:center;gap:12px;justify-content:space-between}footer p{margin:0}.clock{min-width:65px;font-variant-numeric:tabular-nums}
@media(max-width:760px){header,footer{align-items:start;flex-direction:column}.board{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #b4ac94}.layout{padding:9px}.map-label{font-size:2.8px}}
</style></head><body><main class="layout">
<header><div><h1>多战场联动样板</h1><p>原创示意场景 · 用于测试战场联动</p></div><div class="views" id="views"></div></header>
<div class="board"><svg id="map" role="img" aria-label="三个战场与各支部队的持续位置" viewBox="0 0 100 68" preserveAspectRatio="xMidYMid meet">
<rect class="land" x="-30" y="-30" width="160" height="130"/><path class="river" d="M 12,-24 C 41,0 6,10 28,29 S 7,58 13,93"/><g id="routes"></g><g id="landmarks"></g><g id="forces"></g></svg>
<aside><div><h2>战场状态</h2><ul id="front-status"></ul></div><div><h2>部队视角与士气</h2><ul id="units"></ul></div><h2>事件记录</h2><ol id="journal"></ol></aside></div>
<footer><div class="play"><button type="button" id="play">开始</button><button type="button" id="reset">重置</button><button type="button" id="result" disabled>录入东线胜果（演示）</button><output class="clock" id="clock">0:00</output></div><p id="help">切换视角时战役继续推进。援军抵达东线后，可录入胜果。</p></footer>
</main><script src="battle-units.js"></script><script src="campaign-state.js"></script><script src="campaign-demo-config.js"></script><script src="campaign-demo.js"></script></body></html>
